name: Generate test resources

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rsc: linux
          - os: windows-latest
            rsc: windows

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt -r requirements_test.txt
    - name: Generate test resources
      run: python tests/generate_resources.py
    - name: Verify that the test suite passes with them
      run: pytest
    - name: Upload tests/resources/${{ matrix.rsc }}
      uses: actions/upload-artifact@v4
      with:
        name: test_data-${{ matrix.rsc }}
        path: tests/resources/${{ matrix.rsc }}/
